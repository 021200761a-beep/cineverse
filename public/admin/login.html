<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineVerse Admin · Acceso</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-page"><main class="login-card"><div class="brand"><span class="brand-mark">CV</span><span>Cine<span>Verse</span></span></div><div class="eyebrow">CENTRO DE CONTROL</div><h1>Bienvenido de nuevo</h1><p>Ingresa con tu cuenta administrativa para gestionar la plataforma.</p><form id="loginForm"><label>Usuario<input name="username" autocomplete="username" required placeholder="admin"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></label><button class="btn primary full">Iniciar sesión <span>→</span></button><div id="error" class="error"></div></form><small>Acceso restringido · CineVerse Administration</small></main><script>
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const b=e.target.querySelector('button');b.disabled=true;b.textContent='Verificando…';document.querySelector('#error').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok)throw Error(d.error);location.href='/admin';}catch(x){document.querySelector('#error').textContent=x.message;b.disabled=false;b.innerHTML='Iniciar sesión <span>→</span>';}});
</script></body></html>
